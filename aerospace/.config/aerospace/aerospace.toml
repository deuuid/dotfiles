config-version = 2
start-at-login = true 

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

after-startup-command = ['exec-and-forget sketchybar']

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_focus_change']

accordion-padding = 0

default-root-container-layout = 'accordion'

default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true 
persistent-workspaces = [ '1', '2', '3', '4', '8', '9' ]
on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-f = 'exec-and-forget open -n -a firefox'
    alt-m = 'exec-and-forget open -a mattermost'
    alt-quote = 'exec-and-forget open -a kitty'
    alt-semicolon = 'exec-and-forget kitten quick-access-terminal ~'

    alt-t = 'exec-and-forget $HOME/.config/aerospace/scripts/todo.sh'
    alt-c = 'exec-and-forget $HOME/.config/aerospace/scripts/calendar.sh'

    alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

    alt-shift-leftSquareBracket = 'workspace prev'
    alt-shift-rightSquareBracket = 'workspace next'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

[mode.service.binding]

    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
    if.app-name-regex-substring = 'chromium'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-name-regex-substring = '[Mm]attermost'
    run = 'move-node-to-workspace 9'

[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = 'move-node-to-workspace 8 --focus-follows-window'

[[on-window-detected]]
    if.app-name-regex-substring = 'Telemost'
    run = 'move-node-to-workspace 8 --focus-follows-window'

