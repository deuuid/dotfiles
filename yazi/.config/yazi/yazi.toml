[mgr]
show_hidden    = false
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_symlink   = true
scrolloff      = 5

[opener]
zip_unzip = [
	{ run = 'f=%s1; unzip "$f" -d "$(dirname "$f")/$(basename "$f" .zip)"', block = true, for = "unix", desc = "Extract to folder" }
]
neovide = [
	{ run = 'open -a Neovide %s', for = "macos", desc = "Neovide" }
]
libreoffice = [
	{ run = 'open -a LibreOffice %s', for = "macos", desc = "LibreOffice" }
]

[open]
prepend_rules = [
	{ url = "*.csv", use = [ "libreoffice", "edit", "neovide", "reveal" ] },
	{ url = "*.zip", use = [ "extract", "zip_unzip", "reveal" ] },
	{ mime = "text/*", use = [ "edit", "neovide", "reveal" ] },
	{ mime = "application/{json,ndjson}", use = [ "edit", "neovide", "reveal" ] },
]

[plugin]
prepend_previewers = [
	{ url = "*.csv", run = 'piper -- if iconv -f utf-8 -t utf-8 "$1" >/dev/null 2>&1; then cat "$1"; else iconv -f cp1251 -t utf-8 "$1"; fi | bat -p --color=always --file-name "$1"' },
	{ url = "*.md",  run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
]
